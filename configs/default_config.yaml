crop_size: [64, 64, 64]

model_cfg:
  net:
    type: null

data_cfg:
  dataset: "mri2pet"
  data_root: null
  crop_size: ${crop_size}
  resize_size: null
  patch_based: False

train_cfg:
  crop_size: ${crop_size}
  strategy: "auto"
  devices: "auto"
  amp: False
  precision: "32-true"  # 16-mixed 32-true
  batch_size: 2
  num_workers: 4
  num_epochs: 1000
  save_freq: 50
  loss: ["mae"]
  loss_weights:
    mae: 1.0
  limit_train_batches: .inf

val_cfg:
  start_val: 0
  val_freq: 50
  overlap_ratio: 0.7
  patch_size: ${crop_size}
  full_val_epoch: null
  limit_val_batches: .inf
  crop_foreground: True
  infer_mode: "constant"  # "gaussian"

optim_cfg:
  optimizer: "AdamW"
  base_lr: 1.0e-3
  start_factor: 0.01
  lr_min: 0.
  weight_decay: 0.01
  layer_decay: null
  warmup_epochs: 10
  grad_clip: null
  betas: [0.9, 0.999]
  eps: 1e-8
  scheduler: "cosine"  # 'cosine', 'plateau'

